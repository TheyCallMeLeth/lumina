<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel | Lumina</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b1120] text-white min-h-screen overflow-x-hidden">

<!-- Background -->
<div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute top-[-250px] left-[-150px] w-[600px] h-[600px] bg-indigo-500 opacity-20 blur-[160px] rounded-full"></div>
    <div class="absolute bottom-[-250px] right-[-150px] w-[600px] h-[600px] bg-purple-600 opacity-20 blur-[160px] rounded-full"></div>
</div>

<div class="flex flex-col lg:flex-row">

    <!-- SIDEBAR -->
    <aside class="w-full lg:w-72 lg:min-h-screen
                  bg-[#111827]/80 backdrop-blur
                  border-b lg:border-b-0 lg:border-r border-slate-800">

        <div class="p-6 lg:p-8">

            <!-- LOGO -->
            <div class="flex items-center gap-3">

                <div class="w-11 h-11 lg:w-12 lg:h-12
                            rounded-2xl bg-indigo-500
                            flex items-center justify-center
                            font-bold text-xl">
                    L
                </div>

                <div>
                    <h1 class="text-xl lg:text-2xl font-bold text-indigo-400">
                        Lumina
                    </h1>
                    <p class="text-xs text-slate-500">
                        Plataforma Escolar
                    </p>
                </div>

            </div>

            <!-- MENU -->
            <div class="mt-8 lg:mt-12 grid grid-cols-2 lg:grid-cols-1 gap-3 lg:space-y-3 lg:space-x-0">

                <a href="/dashboard"
                   class="flex items-center gap-3 bg-indigo-500/15 border border-indigo-500/20 text-indigo-300 p-3 lg:p-4 rounded-2xl">
                    🏠 Dashboard
                </a>

                <a href="/avisos"
                   class="flex items-center gap-3 hover:bg-slate-800 p-3 lg:p-4 rounded-2xl transition">
                    📢 Avisos
                </a>

                <a href="/calendario"
                   class="flex items-center gap-3 hover:bg-slate-800 p-3 lg:p-4 rounded-2xl transition">
                    📅 Calendário
                </a>

                <a href="/monitorias"
                   class="flex items-center gap-3 hover:bg-slate-800 p-3 lg:p-4 rounded-2xl transition">
                    👥 Monitorias
                </a>

                <a href="/forum"
                   class="flex items-center gap-3 hover:bg-slate-800 p-3 lg:p-4 rounded-2xl transition">
                    ❓ Fórum
                </a>

                <a href="/ranking"
                   class="flex items-center gap-3 hover:bg-slate-800 p-3 lg:p-4 rounded-2xl transition">
                    🏆 Ranking
                </a>

            </div>

            <!-- LOGOUT -->
            <div class="mt-8 lg:mt-10 pt-4 border-t border-slate-800">

                <form th:action="@{/logout}" method="post">
                    <button type="submit"
                            class="w-full flex items-center justify-center lg:justify-start gap-3
                                   p-3 lg:p-4 rounded-2xl
                                   bg-red-500/10 border border-red-500/20
                                   text-red-300 hover:bg-red-500/20 transition">
                        🚪 Sair
                    </button>
                </form>

            </div>

        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-5 lg:p-10">

        <!-- HEADER -->
        <div class="flex flex-col lg:flex-row justify-between gap-6 mb-10">

            <div>

                <span class="inline-flex bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 px-4 py-2 rounded-full text-sm">
                    ✨ Área do Usuário
                </span>

                <h1 class="text-3xl lg:text-5xl font-bold mt-5">
                    Olá,
                    <span class="text-indigo-400" th:text="${usuario.nome}">
                        Usuário
                    </span>
                </h1>

                <p class="text-slate-400 mt-3 text-base lg:text-lg">
                    Bem-vindo de volta ao Lumina.
                </p>

            </div>

            <!-- PERFIL -->
            <div class="bg-[#111827]/90
            border border-slate-800
            rounded-3xl
            p-5 lg:p-6
            w-full lg:w-[360px] lg:shrink-0">

                <h2 class="font-bold text-lg lg:text-xl mb-5">
                    Seu Perfil
                </h2>

                <div class="space-y-3 text-sm lg:text-base">

                    <div>
                        <p class="text-slate-500 text-xs">Nome</p>
                        <p th:text="${usuario.nome}"></p>
                    </div>

                    <div>
                        <p class="text-slate-500 text-xs">Email</p>
                        <p th:text="${usuario.email}"></p>
                    </div>

                    <div>
                        <p class="text-slate-500 text-xs">Cargo</p>
                        <p th:text="${usuario.role}"></p>
                    </div>

                    <div>
                        <p class="text-slate-500 text-xs">Desde</p>
                        <p th:text="${usuario.dataCriacao}"></p>
                    </div>

                </div>

            </div>

        </div>

        <!-- STATS -->
        <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-6 mb-10">

            <div class="bg-[#111827] border border-slate-800 rounded-3xl p-5 lg:p-6">
                <p class="text-slate-400 text-sm">XP</p>
                <h2 class="text-2xl lg:text-4xl font-bold text-indigo-400 mt-2">0</h2>
            </div>

            <div class="bg-[#111827] border border-slate-800 rounded-3xl p-5 lg:p-6">
                <p class="text-slate-400 text-sm">Avisos</p>
                <h2 class="text-2xl lg:text-4xl font-bold mt-2">0</h2>
            </div>

            <div class="bg-[#111827] border border-slate-800 rounded-3xl p-5 lg:p-6">
                <p class="text-slate-400 text-sm">Eventos</p>
                <h2 class="text-2xl lg:text-4xl font-bold mt-2">0</h2>
            </div>

            <div class="bg-[#111827] border border-slate-800 rounded-3xl p-5 lg:p-6">
                <p class="text-slate-400 text-sm">Conquistas</p>
                <h2 class="text-2xl lg:text-4xl font-bold mt-2">0</h2>
            </div>

        </section>

        <!-- GRID -->
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 lg:gap-8">

            <!-- AVISOS -->
            <section class="bg-[#111827] border border-slate-800 rounded-3xl p-5 lg:p-8">

                <div class="flex justify-between items-center mb-6">

                    <h2 class="text-xl lg:text-2xl font-bold">
                        📢 Avisos
                    </h2>

                    <button class="bg-indigo-500 hover:bg-indigo-600 transition px-3 py-2 rounded-xl text-sm">
                        Novo
                    </button>

                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 lg:p-5">
                    Nenhum aviso disponível
                </div>

            </section>

            <!-- AÇÕES -->
            <section class="bg-[#111827] border border-slate-800 rounded-3xl p-5 lg:p-8">

                <h2 class="text-xl lg:text-2xl font-bold mb-6">
                    🚀 Acesso Rápido
                </h2>

                <div class="grid grid-cols-2 gap-3 lg:gap-4">

                    <button class="bg-slate-900 p-4 lg:p-5 rounded-2xl border border-slate-800">
                        📢 Avisos
                    </button>

                    <button class="bg-slate-900 p-4 lg:p-5 rounded-2xl border border-slate-800">
                        📅 Eventos
                    </button>

                    <button class="bg-slate-900 p-4 lg:p-5 rounded-2xl border border-slate-800">
                        👥 Monitoria
                    </button>

                    <button class="bg-slate-900 p-4 lg:p-5 rounded-2xl border border-slate-800">
                        ❓ Fórum
                    </button>

                </div>

            </section>

        </div>

    </main>

</div>

</body>
</html>
