<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Aviso | Lumina</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b1120] text-white min-h-screen overflow-x-hidden">

<!-- Background -->
<div class="fixed inset-0 -z-10 overflow-hidden">

    <div class="absolute top-[-200px] left-[-150px] w-[500px] h-[500px] bg-indigo-500 opacity-20 blur-[160px] rounded-full"></div>

    <div class="absolute bottom-[-200px] right-[-150px] w-[500px] h-[500px] bg-purple-600 opacity-20 blur-[160px] rounded-full"></div>

</div>

<!-- HEADER -->
<header class="w-full border-b border-slate-800 bg-[#0f172a]/80 backdrop-blur">

    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

        <a href="/avisos" class="flex items-center gap-3">

            <div class="w-11 h-11 rounded-2xl bg-indigo-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30">
                L
            </div>

            <div>
                <h1 class="text-2xl font-bold text-indigo-400">Lumina</h1>
                <p class="text-xs text-slate-500">Criar Aviso</p>
            </div>

        </a>

    </div>

</header>

<!-- MAIN -->
<main class="max-w-3xl mx-auto px-6 py-12">

    <h1 class="text-4xl font-bold mb-2">
        📢 Novo Aviso
    </h1>

    <p class="text-slate-400 mb-10">
        Crie um aviso para a comunidade escolar.
    </p>

    <!-- ERRO -->
    <div th:if="${erro}"
         class="mb-6 p-4 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-300">

        ⚠️ <span th:text="${erro}"></span>

    </div>

    <!-- FORM -->
    <form method="post" action="/avisos/novo"
          class="space-y-6 bg-[#111827] border border-slate-800 rounded-3xl p-8">

        <!-- TÍTULO -->
        <div>
            <label class="text-slate-300">Título</label>
            <input type="text"
                   name="titulo"
                   class="w-full mt-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 focus:border-indigo-500 outline-none"
                   placeholder="Ex: Prova de Matemática">
        </div>

        <!-- DESCRIÇÃO -->
        <div>
            <label class="text-slate-300">Descrição</label>
            <textarea name="descricao"
                      rows="4"
                      class="w-full mt-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 focus:border-indigo-500 outline-none"
                      placeholder="Detalhes do aviso..."></textarea>
        </div>

        <!-- PRIORIDADE (ENUM) -->
        <div>
            <label class="text-slate-300">Prioridade</label>
            <select name="prioridade"
                    class="w-full mt-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 focus:border-indigo-500 outline-none">

                <option value="BAIXA">Baixa</option>
                <option value="MEDIA">Média</option>
                <option value="ALTA">Alta</option>
                <option value="URGENTE">Urgente</option>

            </select>
        </div>

        <!-- PÚBLICO (ENUM) -->
        <div>
            <label class="text-slate-300">Público Alvo</label>
            <select name="publicoAlvo"
                    class="w-full mt-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 focus:border-indigo-500 outline-none">

                <option value="TODOS">Todos</option>
                <option value="ALUNOS">Alunos</option>
                <option value="PROFESSORES">Professores</option>
                <option value="ADMIN">Administração</option>

            </select>
        </div>

        <!-- BOTÃO -->
        <button type="submit"
                class="w-full bg-indigo-500 hover:bg-indigo-600 transition rounded-2xl py-4 font-semibold text-lg shadow-lg shadow-indigo-500/20">

            Publicar Aviso

        </button>

    </form>

</main>

</body>
</html>
